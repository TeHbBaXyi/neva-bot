name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://neva:neva@localhost:5432/neva_bot_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neva
          POSTGRES_PASSWORD: neva
          POSTGRES_DB: neva_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neva -d neva_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run handler and mailer unit tests
        run: python -m unittest -v test_handlers.py test_mailer.py
      - name: Run Postgres smoke test
        run: python test_smoke.py
